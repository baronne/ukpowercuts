# One Worker for everything: it serves the static site (web/dist), answers /api/*, and runs the 5-minute cron.
# Deploy with `npm run deploy` from the repo root (it builds the site first).
name = "uk-powercut-map"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# The ukpowercuts.uk zone must be on this Cloudflare account, with no leftover A/CNAME records for these names
# (deploy creates them, plus the certificates).
routes = [
  { pattern = "ukpowercuts.uk", custom_domain = true },
  { pattern = "www.ukpowercuts.uk", custom_domain = true },
]

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "uk-powercut-map"

# The built site. Static files are answered by Cloudflare directly (free, and they don't run the Worker or
# count against its request limit); only the paths below run our code.
[assets]
directory = "../web/dist"
run_worker_first = ["/api/*", "/exports/*", "/__poll"]

# Secrets (set with `wrangler secret put`): SPEN_KEY, ENWL_KEY
[vars]
# DNOs left out of the bulk daily exports until their licences are confirmed.
EXPORT_EXCLUDE = "ssen,nie"
# The site and API share one origin, so no CORS is needed. To let another site call the API from a browser,
# list its origin here (comma-separated), e.g. ALLOWED_ORIGINS = "https://example.org".
ALLOWED_ORIGINS = ""
# Daily exports keep being written to R2; set to "true" to serve them publicly at /exports/.
PUBLIC_EXPORTS = "false"

# Workers Logs: keep our own console.warn lines (a feed failing); skip per-request invocation logs so
# public traffic can't inflate log volume.
[observability.logs]
enabled = true
invocation_logs = false
