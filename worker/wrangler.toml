name = "uk-powercut-map"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# Keep the old workers.dev address alive so existing links and the previous site build keep working.
workers_dev = true

# Serve the API on the site's own domain (this route runs in front of the site's custom domain).
routes = [{ pattern = "ukpowercuts.uk/api/*", zone_name = "ukpowercuts.uk" }]

[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "uk-powercut-map"

# Secrets (set with `wrangler secret put`): SPEN_KEY, ENWL_KEY
# Optional var: EXPORT_EXCLUDE = "ssen,nie"  (DNOs left out of the bulk daily exports until licences are confirmed)
[vars]
EXPORT_EXCLUDE = "ssen,nie"
# Only our own site may call the API from a browser (same-origin calls from ukpowercuts.uk need no CORS;
# www and the old workers.dev address do).
ALLOWED_ORIGINS = "https://ukpowercuts.uk,https://www.ukpowercuts.uk,https://uk-power-cut-map-web.baronne.workers.dev"
# Daily exports keep being written to R2; set to "true" to serve them publicly at /exports/.
PUBLIC_EXPORTS = "false"

# Workers Logs: keep our own console.warn lines (a feed failing); skip per-request invocation logs so
# public traffic can't inflate log volume.
[observability.logs]
enabled = true
invocation_logs = false
