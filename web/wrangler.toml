# Static site (Workers static assets). Build first:
#   VITE_API_BASE=https://ukpowercuts.uk VITE_KOFI_URL=https://ko-fi.com/<name> npm run build:web
name = "uk-power-cut-map-web"
compatibility_date = "2026-11-01"

# The ukpowercuts.uk zone must be on this Cloudflare account; deploy creates the DNS records and certificates.
routes = [
  { pattern = "ukpowercuts.uk", custom_domain = true },
  { pattern = "www.ukpowercuts.uk", custom_domain = true },
]

[assets]
directory = "./dist"
