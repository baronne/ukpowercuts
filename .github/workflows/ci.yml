# Runs on every pull request and push to main: typecheck, tests, and a full build of the site and landing pages.
# It never deploys and uses no secrets. Deploy stays a manual `npm run deploy` from main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          npx tsc --noEmit -p packages/core
          npx tsc --noEmit -p web
          npx tsc --noEmit -p worker
      - name: Tests
        run: npm test
      - name: Build site and landing pages
        run: npm run build:web
